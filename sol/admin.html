<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sol Energy Systems | Panel de Administración</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --primary: #ffb703;
            --bg-dark: #0b0f19;
            --card-bg: rgba(15, 23, 42, 0.8);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .admin-header {
            max-width: 800px;
            margin: 0 auto 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 20px 30px;
            border-radius: 16px;
        }

        .admin-card {
            max-width: 800px;
            margin: 0 auto 25px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-family: inherit;
        }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <div class="admin-header">
        <h1 style="font-family: 'Space Grotesk', sans-serif; margin: 0;">⚙️ Administrador Sol Energy</h1>
        <div>
            <a href="dashboard.html" style="color: var(--primary); font-weight: bold; text-decoration: none; margin-right: 15px;">📊 Dashboard CRM</a>
            <a href="index.html" style="color: var(--text-muted); text-decoration: none;">☀️ Sitio Principal</a>
        </div>
    </div>

    <div class="admin-card">
        <h2>📷 Subir Instalación Solar a la Galería</h2>
        <p style="color: var(--text-muted); margin-bottom: 25px;">Sube fotos reales de tus proyectos de paneles solares para mostrarlas automáticamente en la galería comercial.</p>

        <form id="uploadForm">
            <div class="form-group">
                <label>Seleccionar Foto (JPG, PNG)</label>
                <input type="file" id="photoFile" accept="image/*" required>
            </div>
            <button type="submit" class="btn-submit">Subir y Publicar en la Galería</button>
        </form>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('photoFile');
            if (!fileInput.files.length) return;

            const formData = new FormData();
            formData.append('photo', fileInput.files[0]);

            try {
                const res = await fetch('/api/gallery', {
                    method: 'POST',
                    body: formData
                });
                if (res.ok) {
                    alert('¡Foto publicada con éxito en la Galería Solar!');
                    document.getElementById('uploadForm').reset();
                } else {
                    alert('Error subiendo la foto.');
                }
            } catch (err) {
                alert('Error de red al subir la foto.');
            }
        });
    </script>
</body>
</html>
